# Checks of Nodestro Local Docker. Builds and tests the image on real amd64 and arm64 Linux runners; publishes
# nothing (no registry push, no release): the image stays on the runner, only the manifest is kept as an artifact.
# No token: the Nodestro and Orkexa repositories are public.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Shell scripts
        run: shellcheck nodestro scripts/*.sh
      - name: PowerShell launcher parses
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/nodestro.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }
      - name: Compose files
        run: |
          docker compose -f compose.yaml config -q
          NODESTRO_EXTRA_CA_FILE=/etc/ssl/certs/ca-certificates.crt docker compose -f compose.yaml -f compose.extra-ca.yaml config -q
          docker compose -f compose.yaml -f tests/compose.test.yaml config -q
      - name: Test code
        run: pipx run ruff==0.14.0 check tests
      - name: Pins (full SHAs on master, studio pins agree)
        run: scripts/check-pins.sh

  windows-launcher:
    # Windows runners have no Linux containers, so this only runs the launcher's own code on real Windows PowerShell.
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Help (Windows PowerShell 5.1 and PowerShell 7)
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .\nodestro.ps1 help
          if ($LASTEXITCODE -ne 0) { exit 1 }
          pwsh -NoProfile -File .\nodestro.ps1 help
          if ($LASTEXITCODE -ne 0) { exit 1 }
          pwsh -NoProfile -File .\nodestro.ps1 no-such-command
          if ($LASTEXITCODE -ne 1) { Write-Error "an unknown command must fail"; exit 1 }
          exit 0
        shell: pwsh

  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Environment
        run: |
          uname -m
          docker version
          docker compose version
      - name: Build the image (target local of nodestro-server)
        run: scripts/build-image.sh | tee build.log
      - name: End-to-end tests
        env:
          NODESTRO_IMAGE: nodestro-local:dev
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q pytest==8.4.2
          /tmp/venv/bin/python -m pytest tests/e2e -v -p no:cacheprovider
      - name: End-to-end tests with the PowerShell launcher (PowerShell 7 on Linux)
        # nodestro.ps1 is the Windows launcher. Windows runners have no Linux containers, so its Docker commands
        # (start, backup, restore, update, rollback, uninstall) are tested here, with the same tests.
        if: matrix.platform == 'linux-amd64'
        env:
          NODESTRO_IMAGE: nodestro-local:dev
          NODESTRO_E2E_LAUNCHER: pwsh
        run: |
          pwsh -Version
          /tmp/venv/bin/python -m pytest tests/e2e -v -p no:cacheprovider
      - name: Secret scan of every layer
        run: scripts/scan-image.sh nodestro-local:dev
      - name: Manifest and license inventory
        run: scripts/manifest.sh nodestro-local:dev "manifest-${{ matrix.platform }}" "${{ matrix.platform }}"
      - uses: actions/upload-artifact@v7
        with:
          name: manifest-${{ matrix.platform }}
          path: manifest-${{ matrix.platform }}
          retention-days: 14
      - name: Leftovers
        if: always()
        run: docker ps -a --filter label=dev.nodestro.sandbox --format '{{.ID}} {{.Names}} {{.Status}}'

  rootless:
    # Rootless Docker, the recommended Linux setup: the daemon runs as the runner user with cgroup v2 delegation
    # (memory, CPU, processes), so the gateway's limits are enforced. Rootful Docker only builds the image.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build the image with the rootful daemon
        run: scripts/build-image.sh | tee build.log
      - name: Set up rootless Docker for the runner user
        run: |
          sudo apt-get install -y -q uidmap
          # The runner's Docker has no rootless extras package: take the static ones of the same version, next to
          # its dockerd (the setup tool looks for dockerd in its own folder).
          version="$(docker version --format '{{.Server.Version}}')"
          dir="$(dirname "$(command -v dockerd)")"
          curl -fsSL "https://download.docker.com/linux/static/stable/x86_64/docker-rootless-extras-${version}.tgz" \
            | sudo tar -xz -C "$dir" --strip-components=1
          ls -l "$dir"/dockerd-rootless*.sh "$dir"/rootlesskit
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor; rootlesskit needs them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo mkdir -p /etc/systemd/system/user@.service.d
          printf '[Service]\nDelegate=cpu cpuset io memory pids\n' | sudo tee /etc/systemd/system/user@.service.d/delegate.conf
          sudo systemctl daemon-reload
          sudo loginctl enable-linger "$(id -un)"
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          for _ in $(seq 30); do [ -d "$XDG_RUNTIME_DIR" ] && break; sleep 1; done
          dockerd-rootless-setuptool.sh install --skip-iptables
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
      - name: Rootless daemon enforces the limits
        run: |
          export DOCKER_HOST="unix://$XDG_RUNTIME_DIR/docker.sock"
          docker info --format '{{.SecurityOptions}} cgroup v{{.CgroupVersion}} {{.CgroupDriver}}'
          docker info --format '{{.MemoryLimit}} {{.PidsLimit}} {{.CpuCfsQuota}} {{.CpuCfsPeriod}}' | tee limits
          [ "$(cat limits)" = "true true true true" ] || { echo "the rootless daemon cannot enforce the limits"; exit 1; }
          docker save nodestro-local:dev | docker load
      - name: End-to-end tests on rootless Docker (the launcher finds the rootless socket itself)
        env:
          NODESTRO_IMAGE: nodestro-local:dev
        run: |
          export DOCKER_HOST="unix://$XDG_RUNTIME_DIR/docker.sock"
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q pytest==8.4.2
          /tmp/venv/bin/python -m pytest tests/e2e -v -p no:cacheprovider
      - name: Leftovers
        if: always()
        run: DOCKER_HOST="unix://$XDG_RUNTIME_DIR/docker.sock" docker ps -a --filter label=dev.nodestro.sandbox --format '{{.ID}} {{.Names}} {{.Status}}' || true
