# The nightly run of the default branch (CI-FAST W0, S4): every PR and push check of master once more (ci.yml), the
# real upgrade (upgrade.yml, otherwise only on pin changes and weekly), the image built with the CURRENT
# nodestro-studio master instead of the pinned components.json commit (catches a studio change that breaks this product
# before the next pin bump), and the test-ID inventory. A red run opens or updates the issue "Nightly failed"; a green
# run closes it. Publishes nothing: no registry push, no release; no secrets (the repositories are public).
name: Nightly

on:
  schedule:
    - cron: "45 3 * * *"
  workflow_dispatch:
    inputs:
      canary_fail:
        description: Make the canary job fail, to prove that a red nightly opens the issue
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  upgrade:
    uses: ./.github/workflows/upgrade.yml

  studio-master:
    # scripts/build-image.sh with NODESTRO_COMPONENTS (the option the upgrade test uses): a temporary pin file with
    # studio master and the pinned nodestro-server commit (the image definition), so only the studio changes;
    # components.json is not touched. nodestro-server's own nightly builds server master with studio master.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve nodestro-studio master and write the temporary pin file
        run: |
          set -euo pipefail
          sha=$(git ls-remote https://github.com/peterkarlhuber/nodestro-studio.git refs/heads/master | cut -f1)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::cannot resolve nodestro-studio master"; exit 1; }
          python3 -I - "$sha" "$RUNNER_TEMP/components-studio-master.json" <<'PY'
          import json, sys
          pins = json.load(open("components.json"))
          print(f"pinned studio {pins['nodestro-studio']}, server {pins['nodestro-server']}")
          pins["nodestro-studio"] = sys.argv[1]
          open(sys.argv[2], "w").write(json.dumps(pins, indent=2) + "\n")
          PY
          {
            echo "### Image with nodestro-studio master"
            echo "- studio master: \`$sha\`"
            echo "- pinned in components.json: studio \`$(python3 -I -c 'import json; print(json.load(open("components.json"))["nodestro-studio"])')\`"
            echo "- nodestro-server (image definition, as pinned): \`$(python3 -I -c 'import json; print(json.load(open("components.json"))["nodestro-server"])')\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build the image (target local of nodestro-server)
        env:
          NODESTRO_COMPONENTS: ${{ runner.temp }}/components-studio-master.json
        run: |
          set -o pipefail
          scripts/build-image.sh nodestro-local:studio-master 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Name a dependency conflict of studio master
        # Studio master can pin a component whose own pins lag behind (pip ResolutionImpossible): say so plainly.
        if: ${{ failure() }}
        run: |
          if grep -q ResolutionImpossible "$RUNNER_TEMP/build.log" 2>/dev/null; then
            echo "::error::studio master cannot be installed: pip ResolutionImpossible (a component pin lags behind)"
            { echo "**pip ResolutionImpossible:**"; echo '```'; grep -B 5 -A 25 -m 1 "ResolutionImpossible\|conflict" "$RUNNER_TEMP/build.log" | head -n 60; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: End-to-end tests
        env:
          NODESTRO_IMAGE: nodestro-local:studio-master
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q pytest==8.4.2
          /tmp/venv/bin/python -m pytest tests/e2e -v -p no:cacheprovider
      - name: Container logs of a failed end-to-end run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs-studio-master
          path: /tmp/nodestro-e2e.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Leftovers
        if: always()
        run: docker ps -a --filter label=dev.nodestro.sandbox --format '{{.ID}} {{.Names}} {{.Status}}'

  inventory:
    # The test IDs pytest collects (CI-FAST AP0 baseline): their count and the sha256 of the sorted list.
    runs-on: ubuntu-24.04
    timeout-minutes: 20 # CI-FAST AP1: no run data yet (nightly-only); as the other repos' inventory jobs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Collect the test IDs
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q pytest==8.4.2
          /tmp/venv/bin/python -m pytest --collect-only -q -p no:cacheprovider > test-ids.txt || true
          count=$(grep -c '::' test-ids.txt || true)
          [ "$count" -ge 1 ] || { echo "::error::no test IDs collected"; cat test-ids.txt; exit 1; }
          sum=$(grep '::' test-ids.txt | sort | sha256sum | cut -d' ' -f1)
          {
            echo "### Test-ID inventory"
            echo "- test IDs: $count"
            echo "- sha256 of the sorted list: \`$sum\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-ids
          path: test-ids.txt
          retention-days: 30

  canary:
    # Proves that a red nightly opens an issue (CI-FAST W0 acceptance).
    if: inputs.canary_fail
    runs-on: ubuntu-latest
    timeout-minutes: 10 # CI-FAST AP1: no run data yet (nightly-only); a short job
    steps:
      - run: exit 1

  report:
    needs: [ci, upgrade, studio-master, inventory, canary]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10 # CI-FAST AP1: no run data yet (nightly-only); a short job
    permissions:
      issues: write
    steps:
      - name: Open, update or close the nightly issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Nightly failed"
          failed=$(python3 -c 'import json,os; n=json.loads(os.environ["NEEDS"]); print(" ".join(k for k,v in n.items() if v["result"] not in ("success","skipped")))')
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number,title --jq "map(select(.title==\"$title\"))[0].number // empty")
          if [ -n "$failed" ]; then
            body="Nightly run $RUN_URL failed: $failed (commit $GITHUB_SHA)."
            if [ -n "$number" ]; then gh issue comment "$number" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
            exit 1
          elif [ -n "$number" ]; then
            gh issue comment "$number" --body "Nightly run $RUN_URL is green again (commit $GITHUB_SHA). Closing."
            gh issue close "$number"
          fi
