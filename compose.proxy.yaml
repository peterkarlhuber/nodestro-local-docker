# Behind a mandatory HTTP(S) proxy: the studio (model providers, Python package downloads of tool environments) and
# the local model server (model downloads) send their outgoing requests through it. The launcher adds this file when
# NODESTRO_HTTPS_PROXY is set, before compose.local-models-offline.yaml (which closes Ollama's downloads again).
#
#   NODESTRO_HTTPS_PROXY=http://proxy.example.com:3128 ./nodestro start
#   NODESTRO_NO_PROXY=intranet.example.com          (optional: more hosts to reach directly)
#
# The proxy must be reachable from the containers: not 127.0.0.1 of the host (that is the container itself), but
# its name or address on the network, or host.docker.internal on Docker Desktop. The loopback of the shared network
# namespace (the studio's calls to Ollama on 127.0.0.1:11434) is never sent to the proxy. A TLS-inspecting proxy also
# needs NODESTRO_EXTRA_CA_FILE (compose.extra-ca.yaml).
x-proxy: &proxy
  environment:
    HTTPS_PROXY: ${NODESTRO_HTTPS_PROXY:?NODESTRO_HTTPS_PROXY names the proxy}
    https_proxy: ${NODESTRO_HTTPS_PROXY:?NODESTRO_HTTPS_PROXY names the proxy}
    HTTP_PROXY: ${NODESTRO_HTTPS_PROXY:?NODESTRO_HTTPS_PROXY names the proxy}
    http_proxy: ${NODESTRO_HTTPS_PROXY:?NODESTRO_HTTPS_PROXY names the proxy}
    NO_PROXY: 127.0.0.1,localhost,::1${NODESTRO_NO_PROXY:+,${NODESTRO_NO_PROXY}}
    no_proxy: 127.0.0.1,localhost,::1${NODESTRO_NO_PROXY:+,${NODESTRO_NO_PROXY}}

services:
  nodestro: *proxy
  ollama: *proxy
